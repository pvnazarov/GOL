<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<title>Good Old Library</title>
<meta name="description" content="Good Old Library — Старая Добрая Библиотека. Тысячи книг, быстрый поиск, удобное чтение." />
<link rel="stylesheet" href="assets/app.css" />
<!-- Inline SVG favicon: an open book, cut from the palette in app.css —
     --accent #8a5f2b for the near page, --brass #b8955b for the far one, and a
     darker brown for the spine. A data URI rather than a file, so it costs no
     request and keeps the "nothing is fetched from anywhere else" line that
     the vendored JSZip also holds. Without it every page load asked for
     /gol/favicon.ico and got a 404.

     Shapes are filled, not stroked, and the viewBox is cropped to the content:
     at 16 px a stroked outline of this drawing turns to mush. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='2%206.9%2028%2019.1'%3E%3Cpath%20d='M3%208.4Q9%206.2%2015%2011L15%2025.2%203%2023.6Z'%20fill='%238a5f2b'/%3E%3Cpath%20d='M29%208.4Q23%206.2%2017%2011L17%2025.2%2029%2023.6Z'%20fill='%23b8955b'/%3E%3Cpath%20d='M15%2011h2v14.2h-2z'%20fill='%235a3427'/%3E%3C/svg%3E" />
<script>
  // Set the theme before first paint to avoid a flash of the wrong theme.
  (function () {
    try {
      var saved = localStorage.getItem("gol-theme") || "system";
      var resolved = saved === "system"
        ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : saved;
      document.documentElement.dataset.theme = resolved;
    } catch (e) {}
  })();
</script>
</head>
<body>
  <!-- Atmospheric library photo behind the browsing UI (theme-matched via
       CSS). Decorative only, hence aria-hidden; removed by CSS in the reader. -->
  <div class="bg-layer" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-title">Good Old Library</span>
      <span class="brand-sub">Старая Добрая Библиотека</span>
      <!-- The footer carries this link too, but the footer sits below several
           thousand catalogue entries. The topbar is fixed, so this is the one
           that can actually be reached. -->
      <a class="brand-home" href="https://hatkapina.cc/">← hatkapina.cc</a>
    </div>
    <nav class="tabs" role="tablist" aria-label="Primary">
      <button type="button" class="tab" data-view="libraries" role="tab" aria-selected="true">Library</button>
      <button type="button" class="tab" data-view="search" role="tab" aria-selected="false">Search</button>
      <button type="button" class="tab" data-view="files" role="tab" aria-selected="false">Files</button>
    </nav>
    <div class="topbar-actions">
      <div class="font-controls" id="header-font-controls">
        <button type="button" id="font-family-toggle" class="icon-btn" title="Reader font" aria-label="Reader font"></button>
        <button type="button" id="font-dec" aria-label="Decrease reading font size">A−</button>
        <span id="font-val" class="font-val"></span>
        <button type="button" id="font-inc" aria-label="Increase reading font size">A+</button>
      </div>
      <button type="button" id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme"></button>
    </div>
  </header>

  <main id="app">
    <div id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb"></div>
    <div id="view-root"></div>
  </main>

  <footer class="footer">
    Gutenberg Library: <a href="https://www.gutenberg.org/" target="_blank" rel="noopener">www.gutenberg.org</a>
    <!-- Absolute, and no target="_blank": this is the way back out of the app, not a citation.
         Absolute rather than "/" so the label and the destination always agree — on the LAN host
         a root-relative link would say hatkapina.cc and go somewhere else. -->
    · <a href="https://hatkapina.cc/">← hatkapina.cc</a>
  </footer>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <!-- JSZip is lazy-loaded by reader.js the first time a book is opened,
       instead of being fetched on every page visit. -->
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
